name: orchestr-os

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_USER: ${MYSQL_USER:-orchestr_os}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-orchestr_os}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-orchestr_os}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-orchestr_os_root}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - orchestr-os-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  database-setup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["npm", "run", "db:setup", "--workspace", "backend"]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-mysql://orchestr_os:orchestr_os@mysql:3306/orchestr_os}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-mysql://orchestr_os:orchestr_os@mysql:3306/orchestr_os}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      EXECUTION_TIMEOUT_SECONDS: ${EXECUTION_TIMEOUT_SECONDS:-300}
      EXECUTION_LOG_LIMIT_BYTES: ${EXECUTION_LOG_LIMIT_BYTES:-8192}
    ports:
      - "127.0.0.1:${PORT:-4000}:4000"
    volumes:
      # Required to run workload containers. This grants the backend container
      # full control of the host Docker daemon, which is root-equivalent on the
      # host. Accepted deliberately for a local single-machine prototype and
      # recorded in docs/decision.md; the frontend never receives this access.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      database-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_HOST: 0.0.0.0
      VITE_API_PROXY_TARGET: http://backend:4000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  orchestr-os-mysql-data:
