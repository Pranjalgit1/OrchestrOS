name: orchestr-os

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orchestr_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestr_os}
      POSTGRES_DB: ${POSTGRES_DB:-orchestr_os}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - orchestr-os-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  database-setup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["npm", "run", "db:setup", "--workspace", "backend"]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://orchestr_os:orchestr_os@postgres:5432/orchestr_os?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://orchestr_os:orchestr_os@postgres:5432/orchestr_os?schema=public}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      EXECUTION_TIMEOUT_SECONDS: ${EXECUTION_TIMEOUT_SECONDS:-300}
      EXECUTION_LOG_LIMIT_BYTES: ${EXECUTION_LOG_LIMIT_BYTES:-8192}
    ports:
      - "127.0.0.1:${PORT:-4000}:4000"
    volumes:
      # Required to run workload containers. This grants the backend container
      # full control of the host Docker daemon, which is root-equivalent on the
      # host. Accepted deliberately for a local single-machine prototype and
      # recorded in docs/decision.md; the frontend never receives this access.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      database-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_HOST: 0.0.0.0
      VITE_API_PROXY_TARGET: http://backend:4000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  orchestr-os-postgres-data:
